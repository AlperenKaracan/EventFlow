name: CI

on:
  push:
    branches:
      - main
      - chore/foundation-db
      - feat/**
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.10.6
          python-version: 3.14.3
          enable-cache: true
          working-directory: backend
          cache-dependency-glob: backend/uv.lock

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --frozen --all-groups

      - name: Check formatting
        working-directory: backend
        run: uv run ruff format --check app migrations tests

      - name: Lint
        working-directory: backend
        run: uv run ruff check app migrations tests

      - name: Type check
        working-directory: backend
        run: uv run mypy app tests

      - name: Reject runtime schema creation
        run: |
          if rg --line-number 'create_all|metadata\.create_all' backend/app; then
            echo 'Runtime schema creation is forbidden; use Alembic.' >&2
            exit 1
          fi

      - name: Test with real PostgreSQL
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing

      - name: Audit Python dependencies
        working-directory: backend
        run: uv run pip-audit

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node
        uses: pnpm/setup@v1
        with:
          version: 11.16.0
          runtime: node@22.17.1
          cache: true

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate peer dependencies
        run: pnpm peers check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint Markdown and TypeScript
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run component tests
        run: pnpm test

      - name: Build production frontend
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  compose:
    name: Compose, P0 Playwright, and non-root smoke
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node
        uses: pnpm/setup@v1
        with:
          version: 11.16.0
          runtime: node@22.17.1
          cache: true

      - name: Install locked E2E dependencies
        run: pnpm install --frozen-lockfile --filter @eventflow/e2e...

      - name: Install Playwright Chromium
        run: pnpm --filter @eventflow/e2e exec playwright install --with-deps chromium

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build runtime images
        run: docker compose build backend frontend

      - name: Verify image users
        run: |
          test "$(docker image inspect eventflow-backend:local --format '{{.Config.User}}')" = '10001:10001'
          test "$(docker image inspect eventflow-frontend:local --format '{{.Config.User}}')" = '101:101'

      - name: Start dependency-aware stack
        run: docker compose up -d --wait --wait-timeout 120

      - name: Verify service results and endpoints
        run: |
          test "$(docker inspect eventflow-migrate-1 --format '{{.State.ExitCode}}')" = '0'
          test "$(docker inspect eventflow-seed-1 --format '{{.State.ExitCode}}')" = '0'
          test "$(docker compose exec -T backend id -u)" = '10001'
          test "$(docker compose exec -T frontend id -u)" = '101'
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/ready
          curl --fail --silent http://127.0.0.1:8080/health

      - name: Run P0 browser journey
        env:
          E2E_BASE_URL: http://localhost:8080
        run: pnpm --filter @eventflow/e2e test

      - name: Verify repeatable seed
        run: |
          docker compose run --rm seed
          counts="$(docker compose exec -T db psql -U eventflow -d eventflow -tAc \
            'SELECT (SELECT count(*) FROM users), (SELECT count(*) FROM categories), (SELECT count(*) FROM events), (SELECT count(*) FROM reservations);')"
          test "$counts" = '2|6|6|2'

      - name: Verify backend logs are JSON
        run: |
          docker logs "$(docker compose ps -q backend)" 2>&1 | while IFS= read -r line; do
            printf '%s\n' "$line" | python -m json.tool >/dev/null
          done

      - name: Print diagnostics
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color migrate seed backend frontend

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
