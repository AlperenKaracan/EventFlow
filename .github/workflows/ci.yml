name: CI

on:
  push:
    branches:
      - main
      - chore/foundation-db
      - feat/**
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.10.6
          python-version: 3.14.3
          enable-cache: true
          working-directory: backend
          cache-dependency-glob: backend/uv.lock

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --frozen --all-groups

      - name: Check formatting
        working-directory: backend
        run: uv run ruff format --check app migrations tests

      - name: Lint
        working-directory: backend
        run: uv run ruff check app migrations tests

      - name: Type check
        working-directory: backend
        run: uv run mypy app tests

      - name: Reject runtime schema creation
        run: |
          if rg --line-number 'create_all|metadata\.create_all' backend/app; then
            echo 'Runtime schema creation is forbidden; use Alembic.' >&2
            exit 1
          fi

      - name: Test with real PostgreSQL
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing

      - name: Audit Python dependencies
        working-directory: backend
        run: uv run pip-audit

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node
        uses: pnpm/setup@v1
        with:
          version: 11.16.0
          runtime: node@22.17.1
          cache: true

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate peer dependencies
        run: pnpm peers check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint Markdown and TypeScript
        run: pnpm lint

      - name: Verify repository governance
        run: |
          test -s .github/PULL_REQUEST_TEMPLATE.md
          test -s .github/CODEOWNERS
          test -s SECURITY.md
          grep --fixed-strings --quiet '@AlperenKaracan' .github/CODEOWNERS
          grep --fixed-strings --quiet 'Birleştirme kapısı' .github/PULL_REQUEST_TEMPLATE.md
          grep --fixed-strings --quiet 'Zafiyet bildirimi' SECURITY.md

      - name: Type check
        run: pnpm typecheck

      - name: Run component tests
        run: pnpm test

      - name: Build production frontend
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  compose:
    name: Compose, P0 Playwright, and non-root smoke
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node
        uses: pnpm/setup@v1
        with:
          version: 11.16.0
          runtime: node@22.17.1
          cache: true

      - name: Install locked E2E dependencies
        run: pnpm install --frozen-lockfile --filter @eventflow/e2e...

      - name: Install Playwright Chromium
        run: pnpm --filter @eventflow/e2e exec playwright install --with-deps chromium

      - name: Prepare local environment
        run: |
          cp .env.example .env
          socket_gid="$(stat -c '%g' /var/run/docker.sock)"
          sed -i "s/^DOCKER_SOCKET_GID=.*/DOCKER_SOCKET_GID=${socket_gid}/" .env

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          compose_config="$(docker compose config --format json)"
          test "$(jq --raw-output '.services.backend.stop_signal' <<< "$compose_config")" = 'SIGTERM'
          test "$(jq --raw-output '.services.backend.stop_grace_period' <<< "$compose_config")" = '2m10s'

      - name: Build runtime images
        run: docker compose build backend frontend

      - name: Verify image users
        run: |
          test "$(docker image inspect eventflow-backend:local --format '{{.Config.User}}')" = '10001:10001'
          test "$(docker image inspect eventflow-frontend:local --format '{{.Config.User}}')" = '101:101'

      - name: Start dependency-aware stack
        run: docker compose up -d --wait --wait-timeout 120

      - name: Verify service results and endpoints
        run: |
          test "$(docker inspect eventflow-migrate-1 --format '{{.State.ExitCode}}')" = '0'
          test "$(docker inspect eventflow-seed-1 --format '{{.State.ExitCode}}')" = '0'
          test "$(docker compose exec -T backend id -u)" = '10001'
          test "$(docker compose exec -T frontend id -u)" = '101'
          test "$(docker compose exec -T alloy id -u)" = '473'
          test "$(docker inspect eventflow-loki-1 --format '{{.Config.User}}')" = '10001'
          test "$(docker compose exec -T prometheus id -u)" = '65534'
          docker compose exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/ready
          curl --fail --silent http://127.0.0.1:8080/health
          frontend_headers="$(curl --fail --silent --show-error --dump-header - --output /dev/null http://127.0.0.1:8080/)"
          grep --ignore-case --quiet '^content-security-policy:' <<< "$frontend_headers"
          grep --ignore-case --quiet '^x-content-type-options: nosniff' <<< "$frontend_headers"
          grep --ignore-case --quiet '^x-frame-options: DENY' <<< "$frontend_headers"
          grep --ignore-case --quiet '^referrer-policy: no-referrer' <<< "$frontend_headers"

      - name: Verify repeatable seed
        run: |
          docker compose run --rm seed
          counts="$(docker compose exec -T db psql -U eventflow -d eventflow -tAc \
            'SELECT (SELECT count(*) FROM users), (SELECT count(*) FROM categories), (SELECT count(*) FROM events), (SELECT count(*) FROM reservations);')"
          test "$counts" = '2|6|6|2'

      - name: Run P0 browser journey
        env:
          E2E_BASE_URL: http://localhost:8080
        run: pnpm --filter @eventflow/e2e test

      - name: Verify backend logs are JSON
        run: |
          docker logs "$(docker compose ps -q backend)" 2>&1 | while IFS= read -r line; do
            printf '%s\n' "$line" | python -m json.tool >/dev/null
          done

      - name: Verify Loki and Alloy log pipeline
        run: |
          request_id='019cf263-1d73-7699-9871-c2715a7c5fd2'
          curl --fail --silent --header "X-Request-ID: ${request_id}" http://127.0.0.1:8000/health
          docker compose exec -T backend python - "${request_id}" <<'PY'
          import json
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          request_id = sys.argv[1]
          health_urls = (
              "http://loki:3100/ready",
              "http://alloy:12345/-/healthy",
              "http://prometheus:9090/-/ready",
          )
          for _ in range(30):
              try:
                  for health_url in health_urls:
                      with urllib.request.urlopen(health_url, timeout=5) as response:
                          if response.status != 200:
                              raise RuntimeError(f"unhealthy endpoint: {health_url}")
                  break
              except (OSError, urllib.error.HTTPError, RuntimeError):
                  time.sleep(1)
          else:
              raise SystemExit("Loki or Alloy did not become healthy")

          query = f'{{service_name="backend"}} | json | requestId="{request_id}"'
          url = "http://loki:3100/loki/api/v1/query_range?" + urllib.parse.urlencode(
              {"query": query, "limit": 20}
          )
          for _ in range(30):
              with urllib.request.urlopen(url, timeout=5) as response:
                  result = json.load(response)["data"]["result"]
              if result:
                  break
              time.sleep(1)
          else:
              raise SystemExit("request ID log did not reach Loki")

          with urllib.request.urlopen("http://loki:3100/loki/api/v1/labels", timeout=5) as response:
              labels = set(json.load(response)["data"])
          expected = {"environment", "level", "route", "service_name"}
          if labels != expected:
              raise SystemExit(f"unexpected Loki index labels: {sorted(labels)}")

          prometheus_query = urllib.parse.urlencode(
              {"query": 'up{job="eventflow-backend"}'}
          )
          with urllib.request.urlopen(
              f"http://prometheus:9090/api/v1/query?{prometheus_query}", timeout=5
          ) as response:
              targets = json.load(response)["data"]["result"]
          if not targets or targets[0]["value"][1] != "1":
              raise SystemExit("Prometheus backend target is not UP")
          PY

      - name: Print diagnostics
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color migrate seed backend frontend loki alloy prometheus

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
