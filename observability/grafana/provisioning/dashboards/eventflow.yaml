apiVersion: 1

providers:
  - name: eventflow-overview
    orgId: 1
    folder: EventFlow
    folderUid: eventflow-overview-folder
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/overview

  - name: eventflow-metrics
    orgId: 1
    folder: EventFlow - Metrikler
    folderUid: eventflow-metrics-folder
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/metrics

  - name: eventflow-logs
    orgId: 1
    folder: EventFlow - Log Analizi
    folderUid: eventflow-logs-folder
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/logs
