[project]
name = "eventflow-backend"
version = "0.1.0"
description = "EventFlow modular monolith API"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16.5",
  "argon2-cffi>=25.1.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.116.1",
  "pydantic-settings>=2.10.1",
  "redis>=6.4.0",
  "sqlalchemy[asyncio]>=2.0.43",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.17.1",
  "pip-audit>=2.9.0",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.1",
  "ruff>=0.12.9",
  "testcontainers[postgres,redis]>=4.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ASYNC", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001"] # Turkish user-facing strings legitimately contain dotless i.

[tool.ruff.lint.per-file-ignores]
"app/seed.py" = ["RUF009"] # UUID defaults are immutable deterministic seed identities.
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
