name: eventflow

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:?APP_ENV is required}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
  JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:?ACCESS_TOKEN_TTL_MINUTES is required}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:?REFRESH_TOKEN_TTL_DAYS is required}
  REFRESH_TOKEN_REVOKED_RETENTION_DAYS: ${REFRESH_TOKEN_REVOKED_RETENTION_DAYS:?REFRESH_TOKEN_REVOKED_RETENTION_DAYS is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL is required}
  LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:?LOGIN_RATE_LIMIT_PER_MINUTE is required}
  RESERVATION_RATE_LIMIT_PER_MINUTE: ${RESERVATION_RATE_LIMIT_PER_MINUTE:?RESERVATION_RATE_LIMIT_PER_MINUTE is required}
  DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:?DEPENDENCY_TIMEOUT_SECONDS is required}
  GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS: ${GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS:?GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS is required}
  FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:?FRONTEND_PUBLIC_URL is required}
  BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:?BACKEND_PUBLIC_URL is required}

x-backend-service: &backend-service
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
  image: eventflow-backend:local
  environment: *backend-environment
  init: true
  restart: "no"

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "6379:6379"
    restart: unless-stopped

  migrate:
    <<: *backend-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  seed:
    <<: *backend-service
    command: ["python", "-m", "app.seed"]
    environment:
      <<: *backend-environment
      SEED_ORGANIZER_PASSWORD: ${SEED_ORGANIZER_PASSWORD:?SEED_ORGANIZER_PASSWORD is required}
      SEED_ATTENDEE_PASSWORD: ${SEED_ATTENDEE_PASSWORD:?SEED_ATTENDEE_PASSWORD is required}
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    <<: *backend-service
    depends_on:
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "8000:8000"
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    image: eventflow-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "8080:8080"
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  postgres_data:
